<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Not Found | project0001</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Syne:wght@700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background-color: #1a333d;
        background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 75%),
                          linear-gradient(to bottom, #1a333d 0%, #152830 100%);
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background-color: #14262f;
        border: 1px solid rgba(51, 65, 85, 0.6);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        padding: 40px 32px;
        text-align: center;
      }
      .code {
        font-family: 'Syne', sans-serif;
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
        color: #ffffff;
        margin-bottom: 8px;
      }
      .badge {
        display: inline-block;
        font-family: 'Space Grotesk', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #38bdf8;
        background: rgba(14, 165, 233, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.25);
        padding: 4px 12px;
        margin-bottom: 20px;
      }
      .description {
        font-size: 13px;
        line-height: 1.6;
        color: #94a3b8;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: 'Space Grotesk', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-decoration: none;
        color: #ffffff;
        background-color: #162d36;
        border: 1px solid #375867;
        padding: 10px 24px;
        transition: all 0.2s ease;
      }
      .btn:hover {
        background-color: #1f3e4b;
        border-color: #38bdf8;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <div class="badge">NOT FOUND</div>
      <p class="description">
        The requested portfolio workspace is currently empty or unavailable.
      </p>
      <a href="./" class="btn">RETURN TO WORKSPACE</a>
    </div>
  </body>
</html>
